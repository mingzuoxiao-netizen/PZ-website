name: Website 2.0 QA

on:
  pull_request:
    branches: [main, feature/website-2-editorial-redesign, feature/category-governance-approval]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Automated tests
        run: npm test
      - name: Test staging category API patch
        run: node --check worker-patches/factoryCategoryStaging.mjs && node --test worker-patches/factoryCategoryStaging.test.mjs
      - name: Test production category API candidate
        run: node --check worker-patches/factoryCategoryProduction.mjs && node --test worker-patches/factoryCategoryProduction.test.mjs
      - name: Validate category D1 migration (in-memory SQLite)
        run: python3 worker-patches/test_category_change_migration.py
      - name: Test staging category amendment API
        run: node --check worker-patches/factoryCategoryChangesStaging.mjs && node --test worker-patches/factoryCategoryChangesStaging.test.mjs
      - name: Verify assembled Staging Worker syntax and route isolation
        run: |
          node --check worker-patches/staging-worker-category-changes-REVIEW.js
          node --input-type=module -e "
            import('./worker-patches/staging-worker-category-changes-REVIEW.js').then(async m => {
              const request = new Request('https://staging.example/factory/category-change-requests',{
                method:'POST', headers:{'content-type':'application/json'}, body:'{}'
              });
              const stage = await m.default.fetch(request,{PZ_RUNTIME_ENV:'staging'});
              if(stage.status !== 401) throw Error('Staging anonymous route expected 401, got '+stage.status);
              const prod = await m.default.fetch(request,{PZ_RUNTIME_ENV:'production'});
              if(prod.status !== 403) throw Error('Production on Staging-only route expected 403, got '+prod.status);
            }).catch(e => { console.error(e); process.exit(1); });
          "
      - name: Verify legacy approval requires explicit publishing
        run: |
          node -e "
            const fs = require('fs');
            const s = fs.readFileSync('worker-patches/staging-worker-category-changes-REVIEW.js','utf8');
            const p=s.indexOf('Only pending category requests can be approved'); const q=s.indexOf('Only pending category requests can be rejected'); const a=s.slice(p,q); if(p<0 || q<=p || !a.includes('needsPublish: true') || a.includes('published:site_config') || s.includes('let autoPublish = true;')) process.exit(1);
            if(!s.includes('handleFactoryCategoryRequests') || !s.includes('handleCategoryChanges')) process.exit(1);
          "
      - name: Validate Production D1 schema candidate in memory
        run: python3 worker-patches/test_category_change_production_migration.py
      - name: Test Production category amendments
        run: node --check worker-patches/factoryCategoryChangesProduction.mjs && node --test worker-patches/factoryCategoryChangesProduction.test.mjs
      - name: D1 CAS draft and publish concurrency regression
        run: node --check worker-patches/siteConfigD1Production.mjs && node --test worker-patches/siteConfigD1Production.test.mjs
      - name: Check D1 site config schema in SQLite
        run: python3 worker-patches/test_site_config_d1_migration.py
      - name: Production Worker candidate syntax and auth-isolation
        run: |
          node --check worker-patches/production-worker-category-governance-REVIEW.js
          node --input-type=module -e "
            import('./worker-patches/production-worker-category-governance-REVIEW.js').then(async m => {
              const url='https://production.example/factory/category-change-requests';
              const req=()=>new Request(url,{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
              const prod=await m.default.fetch(req(),{PZ_RUNTIME_ENV:'production'});
              if(prod.status!==401) throw Error('Production auth expected 401, got '+prod.status);
              const stage=await m.default.fetch(req(),{PZ_RUNTIME_ENV:'staging'});
              if(stage.status!==403) throw Error('Production-only module must reject Staging, got '+stage.status);
            }).catch(e=>{ console.error(e);process.exit(1); });
          "
      - name: Production legacy review is draft only
        run: |
          node -e "
            const fs=require('fs');
            const s=fs.readFileSync('worker-patches/production-worker-category-governance-REVIEW.js','utf8');
            const p=s.indexOf('Only pending category requests can be approved');
            const q=s.indexOf('Only pending category requests can be rejected');
            const part=s.slice(p,q);
            if(p<0||q<=p||part.includes('published:site_config')||!part.includes('needsPublish: true'))process.exit(1);
            if(!s.includes('handleProductionCategoryChanges')||!s.includes('category_change_requests'))process.exit(1);
          "
      - name: Build frontend
        run: npm run build
      - name: Build Pages Functions
        run: npx --yes wrangler@4.156.0 pages functions build ./functions --outfile ./pz-functions-qa.mjs --output-routes-path ./pz-routes-qa.json
      - name: Check API route
        run: node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('pz-routes-qa.json','utf8'));if(!v.include.includes('/api/*'))process.exit(1)"
