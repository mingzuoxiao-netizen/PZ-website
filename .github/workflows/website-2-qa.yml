name: Website 2.0 QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Automated tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Build Pages Functions
        run: npx --yes wrangler@4.156.0 pages functions build ./functions --outfile ./pz-functions-qa.mjs --output-routes-path ./pz-routes-qa.json
      - name: Check API route
        run: node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('pz-routes-qa.json','utf8'));if(!v.include.includes('/api/*'))process.exit(1)"
