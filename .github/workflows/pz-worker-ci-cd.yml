name: PZ Worker — source CI and guarded releases

on:
  pull_request:
    paths:
      - 'worker/**'
      - 'utils/fastLane.mjs'
      - 'worker-patches/migrations/018_trusted_operator_fast_lane_REVIEW.sql'
      - 'worker-patches/migrations/019_review_notifications_email_REVIEW.sql'
      - 'worker-patches/migrations/020_bulk_draft_import_REVIEW.sql'
      - 'utils/bulkImportCore.mjs'
      - 'utils/safeZip.mjs'
      - 'utils/safeZip.d.mts'
      - 'utils/zipXlsxImport.mjs'
      - 'utils/zipXlsxImport.d.mts'
      - 'utils/bulkImportCore.d.mts'
      - 'utils/reviewReturn.mjs'
      - 'utils/reviewReturn.d.mts'
      - 'utils/productPreflight.js'
      - 'utils/productPreflight.d.ts'
      - '.github/workflows/pz-worker-ci-cd.yml'
      - 'worker-patches/pz-production-unified-v2-2026-11-10.js'
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'utils/fastLane.mjs'
      - 'worker-patches/migrations/018_trusted_operator_fast_lane_REVIEW.sql'
      - 'worker-patches/migrations/019_review_notifications_email_REVIEW.sql'
      - 'worker-patches/migrations/020_bulk_draft_import_REVIEW.sql'
      - 'utils/bulkImportCore.mjs'
      - 'utils/safeZip.mjs'
      - 'utils/safeZip.d.mts'
      - 'utils/zipXlsxImport.mjs'
      - 'utils/zipXlsxImport.d.mts'
      - 'utils/bulkImportCore.d.mts'
      - 'utils/reviewReturn.mjs'
      - 'utils/reviewReturn.d.mts'
      - 'utils/productPreflight.js'
      - 'utils/productPreflight.d.ts'
      - '.github/workflows/pz-worker-ci-cd.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target (staging is the safe default)'
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

      migrate_staging:
        description: 'Apply audited Staging migrations 017-020 with recovery checkpoint'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # Read-only GitHub deployment approval history

concurrency:
  group: pz-worker-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Worker parity, regression tests and dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify exact source baseline and read-only version endpoint
        run: |
          node --check worker/src/index.js
          node --check utils/bulkImportCore.mjs
          node --check utils/zipXlsxImport.mjs
          node --check worker/scripts/staging-migrate.mjs
          node --check worker/scripts/staging-acceptance.mjs
          node --test worker/tests/source-parity.test.mjs
          node --test worker/tests/preflight.test.mjs
          node --test worker/tests/field-return.test.mjs
          node --test worker/tests/fast-lane.test.mjs
          node --test worker/tests/notifications.test.mjs
          node --test worker/tests/bulk-import.test.mjs
          node --test worker/tests/zip-xlsx-import.test.mjs
          node --test worker/tests/release-gates.test.mjs
          node --test worker/tests/runtime-target.test.mjs
          node --test worker/tests/production-review.test.mjs
          node --check worker/scripts/verify-production-review.mjs
      - name: Existing Worker regression suites
        run: |
          node --test worker-patches/productTwoStageReviewCore.test.mjs
          node --test worker-patches/publishedProductRevisionsCore.test.mjs
          node --test worker-patches/categoryTwoStageReviewCore.test.mjs
          node --test worker-patches/backofficeListsCore.test.mjs
          node --test worker-patches/siteConfigD1Production.test.mjs
          node --test worker-patches/productionWorkerCutoverSafety.test.mjs
      - name: Build frontend and types for shared contract
        run: npm run build && npm run typecheck && npm test
      - name: Safe staging Wrangler dry-run with synthetic binding IDs
        run: |
          node worker/scripts/prepare-deployment.mjs staging dry-run
          npx --yes wrangler@4.156.0 deploy --config worker/wrangler.generated.toml --env staging --dry-run --outdir worker/.wrangler-dry-run

  staging:
    name: Deploy and inspect isolated staging
    needs: validate
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')) &&
      github.ref == 'refs/heads/main' &&
      vars.PZ_STAGING_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render verified staging config and stamp commit SHA
        env:
          PZ_STAGING_SOURCE_REVIEWED: ${{ vars.PZ_STAGING_SOURCE_REVIEWED }}
          PZ_STAGING_RESOURCES_VERIFIED: ${{ vars.PZ_STAGING_RESOURCES_VERIFIED }}
          # Non-secret production references, recorded ONLY after Cloudflare audit.
          # Used solely to reject accidental cross-environment bindings.
          PZ_EXPECTED_PRODUCTION_D1_ID: ${{ vars.PZ_EXPECTED_PRODUCTION_D1_ID }}
          PZ_EXPECTED_PRODUCTION_KV_ID: ${{ vars.PZ_EXPECTED_PRODUCTION_KV_ID }}
          PZ_EXPECTED_PRODUCTION_ASSETS_KV_ID: ${{ vars.PZ_EXPECTED_PRODUCTION_ASSETS_KV_ID }}
          PZ_EXPECTED_PRODUCTION_IMAGES_BUCKET: ${{ vars.PZ_EXPECTED_PRODUCTION_IMAGES_BUCKET }}
          PZ_EXPECTED_PRODUCTION_HISTORY_BUCKET: ${{ vars.PZ_EXPECTED_PRODUCTION_HISTORY_BUCKET }}
          PZ_D1_NAME: ${{ vars.PZ_D1_NAME }}
          PZ_D1_ID: ${{ vars.PZ_D1_ID }}
          PZ_SITE_CONFIG_KV_ID: ${{ vars.PZ_SITE_CONFIG_KV_ID }}
          PZ_ASSETS_KV_ID: ${{ vars.PZ_ASSETS_KV_ID }}
          PZ_PRODUCT_IMAGES_BUCKET: ${{ vars.PZ_PRODUCT_IMAGES_BUCKET }}
          PZ_SITE_CONFIG_HISTORY_BUCKET: ${{ vars.PZ_SITE_CONFIG_HISTORY_BUCKET }}
        run: |
          node worker/scripts/prepare-deployment.mjs staging deploy
          node worker/scripts/stamp-version.mjs staging
      - name: Explicit Staging schema acceptance preparation
        if: github.event_name == 'workflow_dispatch' && inputs.migrate_staging
        env:
          PZ_STAGING_RESOURCES_VERIFIED: ${{ vars.PZ_STAGING_RESOURCES_VERIFIED }}
          PZ_D1_ID: ${{ vars.PZ_D1_ID }}
          PZ_EXPECTED_PRODUCTION_D1_ID: ${{ vars.PZ_EXPECTED_PRODUCTION_D1_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PZ_STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PZ_STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: node worker/scripts/staging-migrate.mjs
      - name: Deploy staging ONLY (no production routes)
        env:
          # These uniquely named secrets belong ONLY to the 'staging' GitHub Environment.
          CLOUDFLARE_API_TOKEN: ${{ secrets.PZ_STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PZ_STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing staging environment deploy credentials'; exit 1; }
          if [ "${{ inputs.migrate_staging }}" = "true" ]; then
            npx --yes wrangler@4.156.0 deploy --config worker/wrangler.generated.toml --env staging --var PZ_FAST_LANE_ENABLED:true --var PZ_BULK_IMPORT_ENABLED:true
          else
            npx --yes wrangler@4.156.0 deploy --config worker/wrangler.generated.toml --env staging
          fi
      - name: Read-only staging smoke checks
        run: node worker/scripts/staging-smoke.mjs


      - name: Real isolated three-role API acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.migrate_staging
        env:
          PZ_STAGING_RESOURCES_VERIFIED: ${{ vars.PZ_STAGING_RESOURCES_VERIFIED }}
          PZ_D1_ID: ${{ vars.PZ_D1_ID }}
          PZ_EXPECTED_PRODUCTION_D1_ID: ${{ vars.PZ_EXPECTED_PRODUCTION_D1_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PZ_STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PZ_STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: node worker/scripts/staging-acceptance.mjs

  production:
    name: Approval-gated production Worker release
    needs: validate
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'pz-worker-v')) ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.target == 'production' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # PRIMARY release gate: GitHub Environment 'production' REQUIRED REVIEWERS.
    # Configure this protection in Settings -> Environments before enabling deploys.
    # SECONDARY, fail-closed: environment-scoped PZ_PRODUCTION_APPROVAL_CONFIRMED.
    # Do NOT preset it to true; enable only for an approved release, then reset.
    # Without Required reviewers, this workflow does not guarantee human approval.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current run has a GitHub production Environment approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: node worker/scripts/verify-production-review.mjs
      - name: Check release gate, bindings and stamp commit SHA
        env:
          PZ_PRODUCTION_APPROVAL_CONFIRMED: ${{ vars.PZ_PRODUCTION_APPROVAL_CONFIRMED }}
          PZ_D1_NAME: ${{ vars.PZ_D1_NAME }}
          PZ_D1_ID: ${{ vars.PZ_D1_ID }}
          PZ_SITE_CONFIG_KV_ID: ${{ vars.PZ_SITE_CONFIG_KV_ID }}
          PZ_ASSETS_KV_ID: ${{ vars.PZ_ASSETS_KV_ID }}
          PZ_PRODUCT_IMAGES_BUCKET: ${{ vars.PZ_PRODUCT_IMAGES_BUCKET }}
          PZ_SITE_CONFIG_HISTORY_BUCKET: ${{ vars.PZ_SITE_CONFIG_HISTORY_BUCKET }}
        run: |
          node worker/scripts/prepare-deployment.mjs production deploy
          node worker/scripts/stamp-version.mjs
      - name: Deploy explicit production Worker name (approval required)
        env:
          # These uniquely named secrets belong ONLY to the 'production' GitHub Environment.
          CLOUDFLARE_API_TOKEN: ${{ secrets.PZ_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PZ_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing production environment deploy credentials'; exit 1; }
          npx --yes wrangler@4.156.0 deploy --config worker/wrangler.generated.toml --env production
      - name: Verify production Worker commit SHA
        run: |
          node --input-type=module -e "
          const u='https://pz-inquiry-api.mingzuoxiao29.workers.dev/version';
          const r=await fetch(u,{signal:AbortSignal.timeout(12000),cache:'no-store'});
          if(!r.ok || (await r.json()).git_sha!==process.env.GITHUB_SHA)
            throw Error('Production Worker SHA mismatch');
          "
