name: PZ V2 Production Read-only Smoke

on:
  push:
    branches: [feature/pz-v2-two-stage-product-approvals]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Production public pages and anonymous route protection (GET only)
        run: node scripts/production-v2-readonly-smoke.mjs
